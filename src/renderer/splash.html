<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalHarness</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 700px at 20% 0%, #3a2a6a 0%, transparent 55%),
          linear-gradient(160deg, #1a1530 0%, #12363a 100%);
        color: #edf4f4;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #7a5cff, #2ec9c0);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 8px 0 0;
        font-size: 22px;
        font-weight: 620;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        max-width: 420px;
        color: #c5d4d4;
        line-height: 1.5;
      }
      #status {
        color: #9adfd8;
        max-width: 640px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #8aa;
        font-size: 12px;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid rgba(154, 223, 216, 0.25);
        border-top-color: #9adfd8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #log {
        margin-top: 8px;
        width: min(720px, 92vw);
        max-height: 34vh;
        overflow: auto;
        text-align: left;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(154, 223, 216, 0.12);
        border-radius: 10px;
        padding: 10px 12px;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #b7d4d1;
        white-space: pre-wrap;
        display: none;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #8aa;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>LocalHarness</h1>
      <p id="status">正在启动官方 Harness…</p>
      <p class="meta"><span class="spinner" aria-hidden="true"></span><span id="elapsed">00:00</span></p>
      <pre id="log"></pre>
      <p class="hint">更新与回滚在菜单栏「LocalHarness」里，不在官方页面中。</p>
    </main>
    <script>
      var started = Date.now()
      window.setStatus = function setStatus(text) {
        var el = document.getElementById("status")
        if (el) el.textContent = text
      }
      window.appendLog = function appendLog(text) {
        var el = document.getElementById("log")
        if (!el) return
        var lines = String(text).split(/\n/)
        var added = 0
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/\s+$/, "")
          if (!line) continue
          el.appendChild(document.createTextNode(line + "\n"))
          added++
        }
        if (!added) return
        el.style.display = "block"
        while (el.childNodes.length > 160) el.removeChild(el.firstChild)
        el.scrollTop = el.scrollHeight
      }
      setInterval(function () {
        var el = document.getElementById("elapsed")
        if (!el) return
        var s = Math.floor((Date.now() - started) / 1000)
        var m = Math.floor(s / 60)
        var r = s % 60
        el.textContent = (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r
      }, 500)
    </script>
  </body>
</html>
