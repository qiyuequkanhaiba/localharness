<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalHarness</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #16141f;
        color: #f3e9e9;
      }
      main {
        min-height: 100%;
        box-sizing: border-box;
        padding: 48px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        max-width: 640px;
        color: #cbb;
        line-height: 1.55;
      }
      pre {
        margin: 12px 0 0;
        max-width: 720px;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        background: #221c24;
        color: #f6d5d5;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Official engine failed to start</h1>
      <p>
        LocalHarness could not launch official <code>@deepseek-ai/dsh</code>.
        Use the LocalHarness menu to restart the engine, roll back, or open logs.
      </p>
      <pre id="message">Unknown error</pre>
    </main>
    <script>
      var params = new URLSearchParams(location.search)
      var message = params.get("message")
      if (message) {
        document.getElementById("message").textContent = message
      }
    </script>
  </body>
</html>
